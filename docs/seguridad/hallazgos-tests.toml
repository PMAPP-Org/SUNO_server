# Mapa hallazgo → test (Paso 25; plan §8, criterio de salida "todos los
# H-01…H-21 tienen al menos un test que los cubre").
#
# Los hallazgos vienen de la revisión de QField/QFieldCloud (doc 07). Cada uno
# lista evidencias: un archivo de uno de los dos repositorios y un texto que
# tiene que aparecer en él (el nombre del test, o el paso de CI). La CI de
# cada repositorio comprueba **sus** evidencias con
# `infra/scripts/check_findings_map.py` (SUNO_server) y
# `tool/check_findings_map.py` (SUNO_client, que lee este archivo de
# SUNO_server): si alguien renombra o borra el test que cubre un hallazgo, la
# CI falla aquí en vez de dejar el hallazgo descubierto en silencio.
#
# `kind`: "test" (test automatizado que corre en CI), "lint" (gate de CI que
# falla la build), "stack" (paso de CI contra el stack de producción real).
# Cada hallazgo aplicable necesita al menos una evidencia "test" o "stack".

[[finding]]
id = "H-01"
title = "Bypass de TLS para servidores propios"
severity = "CRITICAL"
rd = "RD-01"
evidence = [
  { repo = "client", kind = "test", path = "test/core/security/trust_store_test.dart", contains = "certificado no confiable y sin pin: rechazado, sin enviar nada" },
  { repo = "client", kind = "test", path = "test/core/security/trust_store_test.dart", contains = "clave fuera de los pines: rechazado ANTES de enviar la petición" },
  { repo = "client", kind = "test", path = "test/core/security/trust_store_test.dart", contains = "tras aprobarlo, conecta; si el certificado cambia, se bloquea" },
  { repo = "client", kind = "test", path = "test/core/auth/tls_default_rejects_invalid_cert_test.dart", contains = "rechaza un certificado autofirmado" },
  { repo = "client", kind = "test", path = "test/platform/platform_tls_config_test.dart", contains = "App Transport Security sin excepciones" },
  { repo = "client", kind = "lint", path = "tool/lint_no_tls_bypass.sh", contains = "FORBIDDEN_PATTERN=" },
]

