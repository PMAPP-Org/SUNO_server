name: Deploy master

# Producción sigue directamente a master. Cada commit genera una imagen
# inmutable, atestada y fijada por digest; deploy.yml comprueba después que el
# servidor terminó sirviendo ese mismo SHA.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: deploy-master-production
  cancel-in-progress: false

jobs:
  image:
    name: Imagen de master → GHCR (+ procedencia)
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build y push por SHA
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/suno-api"
          tag="master-${GITHUB_SHA}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${image}:${tag}" server/
          docker push "${image}:${tag}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:${tag}" | cut -d@ -f2)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Publicada \`${image}@${digest}\` para \`${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Publicar SHA en producción
    needs: image
    # GitHub Actions y actionlint 1.7.12 solo aceptan la ruta relativa `./`.
    uses: ./.github/workflows/deploy.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      version: ${{ github.sha }}
      image: ${{ needs.image.outputs.ref }}
    secrets: inherit # zizmor: ignore[secrets-inherit] # nosemgrep: secrets-inherit
