name: Deploy

# Despliegue a producción (ISO 27001 A.8.32; OWASP A08:2025).
#
# - Lo llama deploy-master.yml en cada push a master (workflow_call), y se
#   puede lanzar a mano para desplegar o volver a una release concreta
#   (workflow_dispatch con el tag).
# - Solo despliega la imagen objetivo fijada por digest y **después de
#   verificar su atestación de procedencia** (`gh attestation verify`): una
#   imagen que no construyó release.yml de este repositorio no llega al servidor.
# - En el servidor ejecuta infra/scripts/deploy.sh por SSH (backup previo,
#   healthcheck, readyz y rollback automático) y al final comprueba /v1/readyz
#   desde fuera.
#
# Requiere el environment `production` (Settings → Environments, restringido
# a `master` y sin aprobación manual para conservar el despliegue continuo):
# secretos DEPLOY_HOST, DEPLOY_SSH_KEY (llave privada de `deploy`),
# DEPLOY_KNOWN_HOSTS (`ssh-keyscan <host>` verificado a mano) y la variable
# PRODUCTION_URL. Ver docs/operacion/despliegue.md.
#
# Llamado desde release.yml, los secretos del environment solo llegan si el
# llamador usa `secrets: inherit`: sin eso GitHub entrega las variables del
# environment pero los secretos vacíos (pasó con la v0.3.0, que se omitió).
# Lanzado a mano (workflow_dispatch), el environment los entrega directamente.

on:
  workflow_call:
    inputs:
      version:
        description: Tag de release (vX.Y.Z) o SHA exacto de master
        type: string
        required: true
      image:
        description: Imagen fijada por digest (ghcr.io/…@sha256:…); si falta, se resuelve desde el tag
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Tag de la release a desplegar (vX.Y.Z); también para volver a una anterior
        type: string
        required: true

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
      packages: read # resolver el digest en GHCR
      attestations: read # verificar la procedencia
    env:
      VERSION: ${{ inputs.version }}
      SCRIPT_REVISION: ${{ github.sha }}
      IMAGE_IN: ${{ inputs.image }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      # EXC-003 (docs/seguridad/excepciones.md): `false` apaga el segundo factor
      # del Admin; `true` lo reactiva; sin definir no se toca `infra/.env`.
      ADMIN_REQUIRE_OTP: ${{ vars.DJANGO_ADMIN_REQUIRE_OTP }}
      # CIDR separados por un espacio. Se persisten en el VPS en cada deploy
      # para que la allowlist no dependa de una edición manual del servidor.
      ADMIN_ALLOWED_IPS: ${{ vars.CADDY_ADMIN_ALLOWED_IPS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validar configuración de producción
        id: cfg
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ] && [ -n "$PRODUCTION_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Producción incompleta: se requieren DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS y PRODUCTION_URL."
            exit 1
          fi

      # Los valores viajan a un comando remoto: se validan antes, para que un
      # tag o una referencia manipulados no puedan inyectar nada en el servidor.
      - name: Validar versión
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || "$VERSION" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "Versión/SHA inválido: $VERSION"; exit 1; }
          [[ "$SCRIPT_REVISION" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "SHA del workflow inválido: $SCRIPT_REVISION"; exit 1; }
          if [ -n "$ADMIN_ALLOWED_IPS" ]; then
            [[ "$ADMIN_ALLOWED_IPS" =~ ^[0-9A-Fa-f:./]+(\ [0-9A-Fa-f:./]+)*$ ]] \
              || { echo "CADDY_ADMIN_ALLOWED_IPS contiene caracteres inválidos"; exit 1; }
            python3 - "$ADMIN_ALLOWED_IPS" <<'PY'
          import ipaddress
          import sys

          for value in sys.argv[1].split(" "):
              ipaddress.ip_network(value, strict=False)
          PY
          fi

      - name: Resolver la imagen objetivo (por digest)
        id: image
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [ -n "$IMAGE_IN" ]; then
            ref="$IMAGE_IN"
          else
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/suno-api"
            digest="$(docker buildx imagetools inspect "${image}:${VERSION#v}" --format '{{json .Manifest}}' \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')"
            ref="${image}@${digest}"
          fi
          [[ "$ref" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || { echo "Referencia de imagen inválida: $ref"; exit 1; }
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Imagen: \`${ref}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar la atestación de procedencia
        if: steps.cfg.outputs.enabled == 'true'
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: gh attestation verify "oci://${REF}" --repo "$GITHUB_REPOSITORY"

      - name: Desplegar por SSH (deploy.sh con rollback automático)
        if: steps.cfg.outputs.enabled == 'true'
        env:
          REF: ${{ steps.image.outputs.ref }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # EXC-003: la línea se fija aquí, antes de ejecutar deploy.sh.
          # El script se extrae del SHA del workflow, no de la versión que tenga
          # el servidor ni del tag objetivo: así una mejora del despliegue sirve
          # inmediatamente y también durante un rollback a una versión antigua.
          # Solo `true`/`false`: el valor acaba dentro de un comando remoto.
          otp_cmd=":"
          case "${ADMIN_REQUIRE_OTP}" in
            "") ;;
            true | false)
              line="DJANGO_ADMIN_REQUIRE_OTP=${ADMIN_REQUIRE_OTP}"
              otp_cmd="if grep -q '^DJANGO_ADMIN_REQUIRE_OTP=' infra/.env; then sed -i 's/^DJANGO_ADMIN_REQUIRE_OTP=.*/${line}/' infra/.env; else { echo; echo '${line}'; } >> infra/.env; fi"
              echo "Admin: ${line}" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "::error::vars.DJANGO_ADMIN_REQUIRE_OTP debe ser true o false"; exit 1 ;;
          esac
          admin_ips_cmd=":"
          if [ -n "$ADMIN_ALLOWED_IPS" ]; then
            line="CADDY_ADMIN_ALLOWED_IPS=${ADMIN_ALLOWED_IPS}"
            admin_ips_cmd="if grep -q '^CADDY_ADMIN_ALLOWED_IPS=' infra/.env; then sed -i 's|^CADDY_ADMIN_ALLOWED_IPS=.*|${line}|' infra/.env; else { echo; echo '${line}'; } >> infra/.env; fi"
            echo "Admin allowlist: ${ADMIN_ALLOWED_IPS}" >> "$GITHUB_STEP_SUMMARY"
          fi
          set +e
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "deploy@${DEPLOY_HOST}" \
            "if [ -d /opt/suno/.git ]; then repo_dir=/opt/suno; elif [ -d /opt/visitacampo/.git ]; then repo_dir=/opt/visitacampo; else echo \"No existe un clon de SUNO en /opt/suno ni en la ruta heredada\" >&2; exit 1; fi; cd \"\$repo_dir\" && ${otp_cmd} && ${admin_ips_cmd} && git fetch --quiet --tags origin master:refs/remotes/origin/master && script=\$(mktemp) && git show '${SCRIPT_REVISION}:infra/scripts/deploy.sh' > \"\$script\" && chmod 700 \"\$script\" && DEPLOY_SH_DETACHED=1 REPO_DIR=\"\$repo_dir\" bash \"\$script\" '${VERSION}' '${REF}'; code=\$?; rm -f \"\${script:-}\"; exit \$code"
          code=$?
          set -e
          rm -f ~/.ssh/deploy_key
          case "$code" in
            0) echo "Desplegado ${VERSION}." >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo "::error::${VERSION} falló y se volvió a la versión anterior (servicio en pie)."; exit 1 ;;
            3) echo "::error::${VERSION} falló y el rollback también: seguir docs/operacion/restauracion.md"; exit 1 ;;
            *) echo "::error::deploy.sh terminó con código ${code}"; exit 1 ;;
          esac

      - name: Comprobación desde fuera
        if: steps.cfg.outputs.enabled == 'true'
        # `%/`: la variable puede terminar en barra (https://dominio/).
        run: curl -fsS -o /dev/null --retry 5 --retry-delay 5 "${PRODUCTION_URL%/}/v1/readyz"
