openapi: 3.1.0

info:
  title: SUNO API
  version: 1.0.0
  summary: Contrato de API v1 (superficie mínima) de SUNO.
  description: |
    Contrato **fuente de verdad** de la API v1 de SUNO, escrito antes que el código
    (doc 08 §8 Fase 0). Ambos extremos —backend Django Ninja + Pydantic v2 y cliente Flutter—
    se validan contra este archivo (**RD-03**).

    Alcance: exactamente la superficie mínima enumerada en
    [doc 08 §6](../../docs/08-arquitectura-propuesta-suno.md#6-contrato-de-api-v1--superficie-mínima).
    No se añaden endpoints fuera de esa lista.

    ### Semántica de sincronización (ADR-003)

    - **Outbox + CAS por versión**: cada operación lleva `op_uuid` (UUIDv7 generado en el
      dispositivo) y `base_version`. El UPSERT se aplica con la guarda `WHERE version = base_version`.
    - **Aplicación síncrona transaccional**: `POST /v1/sync/push` aplica todo el lote dentro de una
      transacción de PostgreSQL y devuelve el resultado por operación en la misma respuesta.
      No hay jobs ni polling en el camino crítico.
    - **Idempotencia**: reenviar un `op_uuid` ya registrado en `sync_op_log` devuelve el resultado
      guardado sin volver a aplicar la operación.
    - **Server-authoritative sin merge de 3 vías**: una operación en `conflict` devuelve la
      **fila autoritativa completa** (`server_row`) para que el cliente reemplace su fila local.
    - **Pull incremental por cursor** (`change_seq`), con orden estricto y tombstones.
    - **Carril de adjuntos independiente**: una visita se acepta aunque sus fotos aún no estén subidas.

    ### Límites de lote (ADR-003)

    `POST /v1/sync/push` acepta como máximo **500 operaciones** y **5 MB** de cuerpo (tras
    descompresión si se usa `Content-Encoding: gzip`). `maxItems: 500` se expresa en el esquema;
    el límite de bytes **no es expresable en OpenAPI/JSON Schema** y se aplica en el servidor
    (Paso 8), devolviendo `413` con `code: payload_too_large`. El cliente pagina el lote.

    ### Versionado del contrato

    Dos ejes independientes:

    - **Versión de ruta** (`/v1/...`): cambia solo ante una ruptura incompatible de la superficie HTTP.
    - **`schema_version`** (entero): versión del *payload* de sync, presente en todos los cuerpos de
      `/v1/sync/*` (RD-03). El cliente negocia compatibilidad con `GET /v1/server/info`
      (`schema_version` y `min_supported_schema_version`) **antes** de sincronizar. Un
      `schema_version` no soportado se rechaza con `code: schema_unsupported`.

    ### Errores

    Cuerpo uniforme `{code, message, details?}` (doc 08 §6), definido **una sola vez**
    (`components/schemas/Error`) y reutilizado en todos los endpoints vía
    `components/responses/*`. El cliente mapea `code` a mensajes traducidos; nunca muestra
    `message` crudo al agente de campo.
  license:
    name: Propietario
  contact:
    name: SUNO

servers:
  - url: https://{host}
    description: Instancia de SUNO (self-hosted o gestionada). TLS estricto siempre (ADR-009).
    variables:
      host:
        default: api.suno.example
        description: Host de la instancia.

tags:
  - name: auth
    description: Autenticación y ciclo de vida de tokens (ADR-008).
  - name: server
    description: Negociación de capacidades y compatibilidad.
  - name: sync
    description: Sincronización offline-first (ADR-003).
  - name: attachments
    description: Adjuntos direccionados por contenido (ADR-007).
  - name: jobs
    description: Estado de trabajos asíncronos (ADR-006).
  - name: health
    description: Liveness y readiness. Sin autenticación, sin filtrar información.
  - name: privacy
    description: Autorización del titular de los datos personales (Ley 1581 de 2012).
  - name: basemaps
    description: Paquetes de mapa base (MBTiles ráster) para trabajar sin red, por organización.
  - name: layers
    description: Capas de referencia GeoJSON (RFC 7946, WGS84) para ver sobre el mapa, por organización.
  - name: projects
    description: Cronograma de proyectos (costos, etapa 1) — avance desde campo.
  - name: equipment
    description: Maquinaria y equipos — ficha, alertas de vigencia y lecturas de medidor desde campo.

security:
  - bearerAuth: []

paths:

  # ---------------------------------------------------------------- auth ----

  /v1/auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Inicia sesión y registra el dispositivo
      description: |
        Devuelve un access token JWT de vida corta (15 min) y un refresh opaco ligado al
        dispositivo (ADR-008). Rate-limited por IP y por cuenta; la respuesta de credenciales
        inválidas es genérica y de tiempo uniforme (no revela si el usuario existe).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/auth/access:
    get:
      operationId: authAccess
      tags: [auth]
      summary: Accesos efectivos del usuario
      description: |
        Devuelve el rol, las capacidades y el alcance por proyecto de cada sección disponible.
        El servidor resuelve estos datos desde la base de datos en cada solicitud: el cliente los
        usa para navegación y operación offline, pero nunca como sustituto de la autorización del
        servidor.
      responses:
        '200':
          description: Autorización funcional vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessProfile'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/auth/refresh:
    post:
      operationId: authRefresh
      tags: [auth]
      summary: Rota el refresh token del dispositivo
      description: |
        Cada refresh **rota** el token. La detección de reuso (llegada de un `verifier` ya rotado)
        revoca **toda la familia del dispositivo**, fuerza re-login y emite un `AuditEvent`
        (ADR-008). Existe una ventana de gracia de 30 s para reintentos concurrentes del mismo
        dispositivo.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens rotados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Revoca el refresh token del dispositivo
      description: |
        Revoca **todo** refresh vivo del dispositivo indicado, no solo la familia del token
        presentado (incluye sesiones de logins anteriores en el mismo dispositivo).
        **No borra la outbox local**: el trabajo pendiente del agente se conserva en el
        dispositivo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Sesión del dispositivo revocada (idempotente).
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  # -------------------------------------------------------------- server ----

  /v1/server/info:
    get:
      operationId: serverInfo
      tags: [server]
      summary: Versión de API, schema_version, hora del servidor y capacidades
      description: |
        Permite **negociar compatibilidad antes de sincronizar**. El cliente compara su
        `schema_version` con `[min_supported_schema_version, schema_version]` y usa `server_time`
        para corregir el desfase de reloj del dispositivo (relevante para URLs prefirmadas, ADR-007).
      responses:
        '200':
          description: Información del servidor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- sync ----

  /v1/sync/bootstrap:
    get:
      operationId: syncBootstrap
      tags: [sync]
      summary: Estado inicial completo + cursor
      description: |
        Se invoca tras instalar la app o tras recibir `409 cursor_expired` (cursor más antiguo que
        la purga de tombstones, 90 días). Devuelve el estado visible completo para el
        `RequestContext` del solicitante y el `cursor` desde el que continuar con
        `GET /v1/sync/pull`.

        **Sin paginación en v1** (doc 08 §6: "estado inicial completo"). El campo `has_more` de
        la respuesta está **reservado** —siempre `false` en v1— para poder introducir paginación
        más adelante sin que los clientes ya desplegados se queden con un estado incompleto sin
        enterarse.
      responses:
        '200':
          description: Estado inicial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/sync/pull:
    get:
      operationId: syncPull
      tags: [sync]
      summary: Filas cambiadas + tombstones + next_cursor
      description: |
        Paginado y con **orden estricto por `change_seq`**. `change_seq` se asigna dentro de la
        transacción de escritura sosteniendo `pg_advisory_xact_lock(org_id)`, de modo que ningún
        cambio puede quedarse por debajo de un cursor ya avanzado.

        Si `cursor` es más antiguo que la purga de tombstones, la respuesta es `409` con
        `code: cursor_expired` y el cliente debe ejecutar `GET /v1/sync/bootstrap`.
      parameters:
        - name: cursor
          in: query
          required: true
          description: |
            Cursor opaco devuelto por `bootstrap` o por el `next_cursor` del pull anterior.
            El cliente **no debe** interpretarlo ni construirlo.
          schema:
            $ref: '#/components/schemas/Cursor'
        - name: limit
          in: query
          required: false
          description: Número máximo de filas (rows + tombstones) por página.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        '200':
          description: Página de cambios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            Cursor caducado (`cursor_expired`). El cliente debe hacer bootstrap completo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/sync/push:
    post:
      operationId: syncPush
      tags: [sync]
      summary: Lote de operaciones idempotentes (aplicación síncrona transaccional)
      description: |
        **Límites de lote (ADR-003): máx. 500 operaciones y máx. 5 MB de cuerpo.**
        `maxItems: 500` es verificable por esquema; el límite de 5 MB **no es expresable en
        OpenAPI/JSON Schema** (no existe una restricción de bytes totales) y se aplica en el
        servidor, que responde `413` con `code: payload_too_large`. El cliente parte el lote.

        Se admite `Content-Encoding: gzip`; los límites se evalúan sobre el cuerpo **descomprimido**.

        La respuesta `200` es un resultado **por operación**: `applied`, `conflict` (incluye
        `server_row` autoritativa) o `rejected` (validación/permisos; el cliente lo pasa a
        `quarantine`, nunca lo descarta en silencio). Un `200` global no implica que todas las
        operaciones se hayan aplicado.

        Reenviar el mismo `op_uuid` devuelve el resultado ya registrado en `sync_op_log`
        (idempotencia real, no re-aplicación). **La unidad de idempotencia es la operación
        (`op_uuid`), nunca el lote** (ADR-003): un lote puede reenviarse con un conjunto de
        operaciones distinto —el cliente pudo mutar su outbox entre intentos— y el resultado
        sigue siendo correcto, porque cada operación se resuelve por separado. `batch_uuid` es
        solo telemetría/auditoría (`sync_op_log`, §4.4) y **no** tiene semántica de detección de
        conflictos: reutilizarlo no produce ningún error.
      parameters:
        - name: Content-Encoding
          in: header
          required: false
          description: Codificación del cuerpo. Se recomienda `gzip` en redes móviles.
          schema:
            type: string
            enum: [gzip]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequest'
      responses:
        '200':
          description: Lote procesado; resultado por operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # --------------------------------------------------------- attachments ----

  /v1/attachments/presign:
    post:
      operationId: attachmentsPresign
      tags: [attachments]
      summary: URL prefirmada de subida (o respuesta de deduplicación)
      description: |
        Si ya existe un `blob` con ese `sha256`, responde `already_present: true` y el cliente
        **no sube nada** (deduplicación por contenido, ADR-007). Si no existe, devuelve
        `upload_url` (PUT directo al object storage, expiración 15 min) y los
        `required_headers` que deben enviarse tal cual en el PUT porque están incluidos en la firma.

        Los bytes **nunca pasan por el API**. Endpoint rate-limited (ADR-008).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
      responses:
        '200':
          description: Resultado de la solicitud de subida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/attachments/{sha256}/commit:
    post:
      operationId: attachmentsCommit
      tags: [attachments]
      summary: Confirma y verifica el objeto subido
      description: |
        Tras el PUT prefirmado el cliente confirma la subida. El servidor hace `HEAD` sobre el
        objeto y **verifica tamaño, MIME y checksum** antes de registrar el `blob`
        (`INSERT ... ON CONFLICT DO NOTHING`). Sin esta verificación, la subida prefirmada sería
        una vía para inyectar contenido arbitrario.

        Idempotente: confirmar un `sha256` ya registrado devuelve el mismo `blob`.
      parameters:
        - $ref: '#/components/parameters/Sha256Path'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '201':
          description: Blob confirmado y registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blob'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: |
            El objeto no supera la verificación: `attachment_checksum_mismatch` (checksum o tamaño
            distintos de lo declarado) o MIME fuera de la allow-list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/attachments/{sha256}/url:
    get:
      operationId: attachmentsDownloadUrl
      tags: [attachments]
      summary: URL prefirmada de descarga
      description: |
        Se emite **solo tras comprobar permisos**; el bucket nunca es público. Si el solicitante
        no puede ver ningún adjunto que referencie ese `sha256`, la respuesta es `404`
        (denegación por inexistencia, RD-11), no `403`.
      parameters:
        - $ref: '#/components/parameters/Sha256Path'
      responses:
        '200':
          description: URL de descarga de corta duración.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadUrlResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------- jobs ----

  /v1/jobs/{id}:
    get:
      operationId: jobStatus
      tags: [jobs]
      summary: Estado de un job asíncrono
      description: |
        Solo rol ADMIN. `output` se persiste ya *scrubbed* (RD-12); nunca contiene secretos ni
        datos personales sin redactar. Un job de otra organización responde `404`, no `403` (RD-11).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Estado del job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------- privacy ----

  /v1/consents:
    post:
      operationId: consentsRecord
      tags: [privacy]
      summary: Registra la autorización de datos personales del titular
      description: |
        Prueba de la autorización **previa, expresa e informada** que exige el art. 9 de la
        Ley 1581: la app muestra el aviso de privacidad antes del primer login, el agente acepta
        cada finalidad, y tras el login la app envía aquí lo que aceptó. Cada llamada guarda una
        fila nueva (historial), nunca se edita.

        El titular es quien llama (`bearerAuth`) y `device_id` tiene que ser **un dispositivo
        suyo** de su organización; si no, `404` (RD-11).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '201':
          description: Autorización registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------ basemaps ----

  /v1/basemaps:
    get:
      operationId: basemapsList
      tags: [basemaps]
      summary: Mapas base offline de la organización
      description: |
        Los paquetes vigentes de la organización de quien llama (cualquier miembro). Los importa
        un administrador desde el servidor; un paquete retirado deja de aparecer, y el cliente lo
        borra del teléfono.
      responses:
        '200':
          description: Paquetes vigentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasemapList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/basemaps/{basemap_id}/download:
    get:
      operationId: basemapsDownload
      tags: [basemaps]
      summary: URL prefirmada de corta duración para descargar un mapa base
      description: |
        Devuelve una URL directa al almacenamiento y el `sha256` con el que el cliente verifica lo
        descargado antes de usarlo. Un paquete inexistente, retirado o de otra organización
        responde `404` sin distinguirlos (RD-11).
      parameters:
        - name: basemap_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: URL de descarga.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasemapDownload'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  # -------------------------------------------------------------- layers ----

  /v1/layers:
    get:
      operationId: layersList
      tags: [layers]
      summary: Capas de referencia de la organización
      description: |
        Las capas GeoJSON vigentes de la organización de quien llama (cualquier miembro):
        predios, lotes, vías… para dibujar sobre el mapa. Las importa un administrador desde el
        servidor; una capa retirada deja de aparecer y el cliente la borra del teléfono.
      responses:
        '200':
          description: Capas vigentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/layers/{layer_id}/download:
    get:
      operationId: layersDownload
      tags: [layers]
      summary: URL prefirmada de corta duración para descargar una capa
      description: |
        URL directa al almacenamiento y el `sha256` con el que el cliente verifica lo descargado.
        Una capa inexistente, retirada o de otra organización responde `404` (RD-11).
      parameters:
        - name: layer_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: URL de descarga.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasemapDownload'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------ projects ----

  /v1/projects/tasks:
    get:
      operationId: projectsTasksList
      tags: [projects]
      summary: Tareas del cronograma de las que quien llama es responsable
      description: |
        Tareas **de detalle vigentes** (ni resumen ni retiradas) de las que quien llama es
        responsable, directamente o por una tarea superior de la EDT, con su último % validado (la
        visita validada más reciente vinculada a la tarea). Es lo que la app ofrece para vincular
        una visita a una tarea (`VisitPayload.task_id`).

        Se entrega la lista **completa** y el cliente reemplaza la suya: una tarea retirada o una
        responsabilidad quitada desaparecen sin tombstones. Para no repetir la descarga, el cliente
        envía la `version` de la última lista; si nada cambió, la respuesta trae `changed: false`
        e `items` vacío.
      parameters:
        - name: version
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: '`version` de la última lista descargada.'
      responses:
        '200':
          description: Lista de tareas, o "sin cambios".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldTaskList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ----------------------------------------------------------- equipment ----

  /v1/equipment:
    get:
      operationId: equipmentList
      tags: [equipment]
      summary: Equipos que quien llama puede ver
      description: |
        Equipos no retirados dentro del alcance de quien llama: toda la organización o los de sus
        proyectos y, para un operador, solo los que tiene asignados hoy. Cada uno trae su ficha
        resumida (identificación, departamento de maquinaria, esquema de control), la última
        lectura de cada medidor configurado, los documentos, los campos adicionales y las alertas
        de vigencia (campos de fecha con aviso y documentos vencidos o por vencer).

        Sin acceso a la sección Equipos la lista va vacía. Se entrega la lista **completa** y el
        cliente reemplaza la suya. Para no repetir la descarga, el cliente envía la `version` de la
        última lista; si nada cambió, la respuesta trae `changed: false` e `items` vacío. Como las
        alertas cuentan días, la `version` cambia al pasar la medianoche cuando hay alertas.
      parameters:
        - name: version
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: '`version` de la última lista descargada.'
      responses:
        '200':
          description: Lista de equipos, o "sin cambios".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldEquipmentList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/equipment/{equipment_id}/meter-readings:
    post:
      operationId: equipmentMeterReadingCreate
      tags: [equipment]
      summary: Registra una lectura de medidor (idempotente por `id`)
      description: |
        Registra la lectura de un medidor configurado en la ficha del equipo. El `id` lo genera
        el cliente: reenviar la misma lectura tras un corte de red devuelve la ya registrada, sin
        duplicarla. Los medidores solo avanzan: una lectura menor que la anterior (o mayor que una
        posterior) del mismo medidor, una fecha futura o un medidor no configurado responden `422`.
        Un equipo inexistente o fuera del alcance de quien llama responde `404`.
      parameters:
        - name: equipment_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterReadingIn'
      responses:
        '200':
          description: Lectura registrada (o la ya existente con ese `id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterReadingOut'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/transport/catalog:
    get:
      operationId: transportCatalog
      tags: [equipment]
      summary: Tramos, materiales, vehículos de terceros y usuarios para registrar viajes
      description: |
        Los tramos activos del mapa de distancias (con su zona y kilómetros), los materiales, los
        vehículos subcontratados (con su empresa y capacidad) y las personas de la organización que
        pueden figurar como quien solicita, despacha o recibe. Los equipos propios que pueden
        transportar vienen en `GET /v1/equipment`. Sin acceso a la sección Equipos las listas van
        vacías. El cliente envía la `version` de la última lista; si nada cambió, la respuesta trae
        `changed: false` y las listas vacías.
      parameters:
        - name: version
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Catálogo de transporte, o "sin cambios".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportCatalog'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/transport/trips:
    post:
      operationId: transportTripCreate
      tags: [equipment]
      summary: Registra un viaje de material (idempotente por `id`)
      description: |
        Registra un viaje con exactamente un vehículo: un equipo propio (`equipment_id`) o uno
        subcontratado (`vehicle_id`). El `id` lo genera el cliente: reenviar el mismo viaje tras un
        corte de red devuelve el ya registrado, sin duplicarlo. El servidor fija la distancia del
        tramo y la tarifa por m³ vigente del material; sin tarifa, el viaje queda sin valorar.

        Exige tres usuarios de la organización (solicita, despacha, recibe) y quien despacha no
        puede ser quien recibe. Responde `422` y no guarda nada si falta o sobra el vehículo, el
        volumen es cero o supera la capacidad del vehículo, la fecha es futura, el tramo o el
        material no existe o está inactivo, o el equipo está retirado. Un equipo fuera del alcance
        responde `404`; sin permiso para registrar viajes, `403`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripIn'
      responses:
        '200':
          description: Viaje registrado (o el ya existente con ese `id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripOut'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/fuel/catalog:
    get:
      operationId: fuelCatalog
      tags: [equipment]
      summary: Estaciones de servicio y tanques propios para registrar tanqueos
      description: |
        Las estaciones de servicio activas (con su proveedor) y los tanques propios de la
        organización, para elegir el origen de un tanqueo sin red. Sin acceso a la sección Equipos
        la lista va vacía. El cliente envía la `version` de la última lista; si nada cambió, la
        respuesta trae `changed: false` y las listas vacías.
      parameters:
        - name: version
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Catálogo de combustible, o "sin cambios".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuelCatalog'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/equipment/{equipment_id}/fuel-fills:
    post:
      operationId: equipmentFuelFillCreate
      tags: [equipment]
      summary: Registra un tanqueo (idempotente por `id`)
      description: |
        Registra un tanqueo en una estación de servicio (`source: station`) o una salida del
        tanque propio (`source: store`). El `id` lo genera el cliente: reenviar el mismo tanqueo
        tras un corte de red devuelve el ya registrado, sin duplicarlo.

        Responde `422` y no guarda nada si el vale ya existe en esa estación o tanque, si falta la
        lectura del medidor (equipo controlado por medidor) o retrocede, si la fecha es futura, si
        el equipo está retirado o si el tanque no tiene stock suficiente. Un equipo inexistente o
        fuera del alcance responde `404`; sin permiso para registrar, `403`.
      parameters:
        - name: equipment_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuelFillIn'
      responses:
        '200':
          description: Tanqueo registrado (o el ya existente con ese `id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuelFillOut'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/equipment/{equipment_id}/usage-reports:
    post:
      operationId: equipmentUsageReportCreate
      tags: [equipment]
      summary: Reporta el uso de un equipo asignado (idempotente por `id`)
      description: |
        El operador reporta su propia jornada con un equipo que tiene asignado, en un proyecto donde
        el equipo está vinculado (`usage_projects` de la ficha). Queda **completada**. El `id` lo
        genera el cliente: reenviar el mismo reporte tras un corte de red devuelve el ya registrado,
        sin duplicarlo. Una jornada repartida entre proyectos se reporta en varios reportes que no se
        solapan.

        Si el equipo se controla por medidor exige las lecturas inicial y final (la final pasa a ser
        la última lectura del equipo y no puede retroceder). Responde `422` y no guarda nada si la
        fecha u hora es futura, la hora final no es posterior a la inicial, falta la actividad, hay
        solape con otro uso del equipo o del operador, el proyecto no está vinculado al equipo, el
        operador no está asignado o el equipo está retirado. Un equipo fuera del alcance responde
        `404`; sin permiso, `403`.
      parameters:
        - name: equipment_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageReportIn'
      responses:
        '200':
          description: Uso registrado (o el ya existente con ese `id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReportOut'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/equipment/{equipment_id}/life-sheet:
    get:
      operationId: equipmentLifeSheet
      tags: [equipment]
      summary: Hoja de Vida del equipo en PDF
      description: |
        El PDF oficial del equipo: identificación, medidores, vigencia de documentos y campos,
        matriz preventiva y los últimos cinco preventivos ejecutados. Los datos financieros solo
        se incluyen si quien llama puede verlos. Un equipo inexistente o fuera del alcance
        responde `404`. La respuesta no se almacena en cachés compartidas.
      parameters:
        - name: equipment_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Documento PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /v1/equipment/{equipment_id}/inspections:
    post:
      operationId: equipmentInspectionCreate
      tags: [equipment]
      summary: Envía un preoperacional (idempotente por `id`)
      description: |
        Registra la inspección preoperacional de un equipo. El `id` lo genera el cliente: reenviar
        la misma inspección tras un corte de red devuelve la ya registrada, sin duplicarla.

        **Todo o nada**: debe responder cada ítem de la lista de chequeo vigente exactamente una
        vez, describir cada ítem fallido y, si el equipo se controla por medidor, traer la lectura
        inicial (que no puede retroceder). Cualquier incumplimiento, un equipo no disponible o una
        fecha futura responden `422` y no se guarda nada. Cada ítem fallido abre una novedad.
        Un equipo inexistente o fuera del alcance responde `404`; sin permiso para registrar
        inspecciones, `403`. Una inspección enviada no se edita: la revisión añade su decisión.
      parameters:
        - name: equipment_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectionIn'
      responses:
        '200':
          description: Inspección registrada (o la ya existente con ese `id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectionOut'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  # -------------------------------------------------------------- health ----

  /v1/healthz:
    get:
      operationId: healthz
      tags: [health]
      summary: Liveness
      description: |
        El proceso está vivo. **Sin autenticación y sin filtrar información**: no devuelve
        versiones, hostnames ni estado de dependencias.
      security: []
      responses:
        '200':
          description: Vivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /v1/readyz:
    get:
      operationId: readyz
      tags: [health]
      summary: Readiness
      description: |
        El proceso puede atender tráfico (dependencias críticas alcanzables).
        **Sin autenticación y sin filtrar información**: el cuerpo no indica *qué* dependencia
        falla; ese detalle vive en los logs.
      security: []
      responses:
        '200':
          description: Listo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: No listo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token JWT firmado con EdDSA/Ed25519, TTL 15 min, claims mínimos
        (`sub`, `org`, `device`, `roles`, `jti`, `exp`). No se persiste en el servidor (ADR-008).

  parameters:
    Sha256Path:
      name: sha256
      in: path
      required: true
      description: Hash SHA-256 en minúsculas del contenido del adjunto.
      schema:
        $ref: '#/components/schemas/Sha256'

  # -- Respuestas de error: el cuerpo uniforme se define UNA vez (Error) y se
  # -- reutiliza aquí; los endpoints solo referencian estas respuestas.
  responses:
    BadRequest:
      description: Solicitud malformada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: |
        Credenciales ausentes, inválidas o access token caducado. El cliente intenta **un**
        refresh; si también falla, pasa a `Disconnected` y pide re-login **sin borrar la outbox**.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        Autenticado pero sin permiso sobre un recurso que sí puede ver. Los recursos de **otra
        organización** responden `404`, no `403` (RD-11).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso inexistente o no visible para el solicitante (RD-11).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: |
        Cuerpo por encima del límite duro (p. ej. lote de sync > 5 MB, o adjunto por encima del
        tamaño máximo). `code: payload_too_large`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: |
        Cuerpo sintácticamente válido pero semánticamente inválido (validación de esquema,
        `schema_unsupported`, checksum de adjunto no coincidente).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 'Límite de tasa superado. `code: rate_limited`.'
      headers:
        Retry-After:
          description: Segundos que el cliente debe esperar antes de reintentar.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Error interno. El `message` es genérico; el detalle vive en los logs (RD-12).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    # ------------------------------------------------------ tipos base ----

    Uuid:
      type: string
      format: uuid
      description: Identificador UUID. Los IDs de entidades sincronizables se generan en el cliente.
      examples:
        - 018f3c2a-6f1e-7c3d-9a2b-4d5e6f708192

    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: SHA-256 hexadecimal en minúsculas.
      examples:
        - e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

    Timestamp:
      type: string
      format: date-time
      description: Instante en RFC 3339 con offset explícito (el servidor emite siempre UTC, `Z`).
      examples:
        - '2026-07-30T14:05:09.123Z'

    SchemaVersion:
      type: integer
      minimum: 1
      description: |
        Versión del *payload* de sincronización (RD-03). Presente en todos los cuerpos de
        `/v1/sync/*`. Se negocia con `GET /v1/server/info`.
      examples:
        - 1

    ChangeSeq:
      type: integer
      format: int64
      minimum: 0
      description: |
        Secuencia monótona de cambios por organización. Asignada dentro de la transacción de
        escritura bajo `pg_advisory_xact_lock(org_id)`.

    Version:
      type: integer
      minimum: 0
      description: Versión de la fila para el CAS optimista (`WHERE version = base_version`).

    Cursor:
      type: string
      pattern: '^c1:[0-9]{20}$'
      description: |
        Cursor de pull **opaco**. Codifica el `change_seq` alcanzado; el cliente lo almacena y lo
        reenvía tal cual, sin interpretarlo. El formato se publica solo para validar la entrada;
        no es algo que el cliente deba construir.
      examples:
        - 'c1:00000000000000102394'

    Mime:
      type: string
      enum:
        - image/jpeg
        - image/png
        - image/webp
        - application/pdf
      description: Allow-list de tipos MIME aceptados para adjuntos (ADR-007).

    # ----------------------------------------------------------- error ----

    ErrorCode:
      type: string
      description: |
        Código estable y legible por máquina. El cliente lo mapea a un mensaje traducido
        (patrón `CloudError`); **nunca** muestra `message` crudo al agente de campo.

        Códigos de contrato (doc 08 §6): `conflict`, `cursor_expired`, `payload_too_large`,
        `schema_unsupported`, `rate_limited`, `attachment_checksum_mismatch`.
        El resto son códigos genéricos de transporte necesarios para describir 400/401/403/404/500.
      enum:
        - conflict
        - cursor_expired
        - payload_too_large
        - schema_unsupported
        - rate_limited
        - attachment_checksum_mismatch
        - invalid_credentials
        - unauthenticated
        - forbidden
        - not_found
        - validation_error
        - internal_error

    Error:
      type: object
      description: |
        **Cuerpo de error uniforme de la API** (doc 08 §6). Definido una sola vez y reutilizado
        en todas las respuestas de error vía `components/responses/*`.
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: |
            Descripción legible por una persona, en inglés y orientada a diagnóstico.
            No es texto de UI: la traducción la resuelve el cliente a partir de `code`.
        details:
          type: [object, 'null']
          additionalProperties: true
          description: |
            Contexto adicional estructurado y **ya redactado** (RD-12): p. ej.
            `{"field": "answers.altura_cm", "reason": "out_of_range"}` o
            `{"expected_sha256": "...", "actual_sha256": "..."}`.
      examples:
        - code: cursor_expired
          message: Cursor is older than the tombstone retention window; run a full bootstrap.
          details:
            oldest_available_change_seq: 91230

    # ------------------------------------------------------------ auth ----

    DeviceInfo:
      type: object
      description: |
        Identificación del dispositivo. `device_id` lo genera el cliente y es estable durante toda
        la vida de la instalación: el refresh token y la outbox son **por dispositivo** (ADR-008).
      required: [device_id, platform, app_version]
      properties:
        device_id:
          $ref: '#/components/schemas/Uuid'
        platform:
          type: string
          enum: [android, ios]
        os_version:
          type: [string, 'null']
          maxLength: 64
          pattern: '^[^\u0000]*$'
        model:
          type: [string, 'null']
          maxLength: 128
          pattern: '^[^\u0000]*$'
        app_version:
          type: string
          maxLength: 32
          pattern: '^[^\u0000]*$'
          description: Versión de la app Flutter (semver).
        display_name:
          type: [string, 'null']
          maxLength: 128
          pattern: '^[^\u0000]*$'
          description: Nombre visible del dispositivo en el back-office ("Tablet campo 3").

    LoginRequest:
      type: object
      required: [username, password, device_info]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 254
          pattern: '^[^\u0000]*$'
        password:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[^\u0000]*$'
          format: password
        device_info:
          $ref: '#/components/schemas/DeviceInfo'

    TokenPair:
      type: object
      description: |
        Par de tokens emitido en login y en cada rotación. El `refresh_token` es **opaco**
        (`selector.verifier`); el servidor solo almacena `sha256(verifier)` (RD-09).
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_token
        - refresh_expires_in
        - server_time
      properties:
        access_token:
          type: string
          description: JWT Ed25519 de vida corta.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Segundos de validez del access token (900 = 15 min).
        refresh_token:
          type: string
          description: Token opaco `selector.verifier`. Se almacena en el llavero seguro del sistema.
        refresh_expires_in:
          type: integer
          minimum: 1
          description: Segundos de validez del refresh (60 días con uso).
        server_time:
          $ref: '#/components/schemas/Timestamp'

    LoginResponse:
      type: object
      required: [tokens, user]
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPair'
        user:
          $ref: '#/components/schemas/UserProfile'

    AccessProfile:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SectionAccessProfile'

    SectionAccessProfile:
      type: object
      required: [section, role, scope, project_ids, capabilities]
      properties:
        section:
          type: string
          enum:
            - FIELD_RECORDS
            - PROJECTS
            - BUDGETS
            - FORMS
            - EQUIPMENT
            - GIS
            - REPORTS
            - USERS_ACCESS
            - OPERATIONS
        role:
          type: string
          enum:
            - MANAGER
            - REVIEWER
            - CONTRIBUTOR
            - VIEWER
            - EQUIPMENT_OPERATOR
            - SST_AUDITOR
            - ACCESS_ADMIN
        scope:
          type: string
          enum: [organization, projects]
        project_ids:
          type: array
          description: Vacío para alcance organizacional o para un alcance de proyectos sin acceso.
          items:
            $ref: '#/components/schemas/Uuid'
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - create
              - read
              - update
              - delete
              - review
              - approve
              - reject
              - assign
              - import
              - publish
              - export
              - schedule
              - manage_access

    RefreshToken:
      type: string
      pattern: '^[A-Za-z0-9_-]+[.][A-Za-z0-9_-]+$'
      description: |
        Refresh token opaco `selector.verifier` (alfabeto base64url). Cualquier otra forma es una
        credencial inválida más: `401`, como un verifier incorrecto.

    RefreshRequest:
      type: object
      required: [refresh_token, device_id]
      properties:
        refresh_token:
          $ref: '#/components/schemas/RefreshToken'
        device_id:
          $ref: '#/components/schemas/Uuid'

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: |
            El refresh token de la sesión que se cierra. Sin patrón a propósito: el logout responde
            `204` con cualquier valor, exista o no, para no servir de oráculo.

    UserProfile:
      type: object
      description: |
        Perfil del usuario autenticado. Se emite en `login` y se lee de nuevo en
        `GET /v1/sync/bootstrap`, por lo que sigue la convención de entidades emitidas por el
        servidor: **todas las propiedades son `required`** y la opcionalidad se expresa con `null`.
      required: [id, username, display_name, org_id, roles]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        username:
          type: string
        display_name:
          type: [string, 'null']
        org_id:
          $ref: '#/components/schemas/Uuid'
        roles:
          type: array
          description: Roles del usuario en `org_id` (tabla `membership`).
          items:
            type: string
          examples:
            - [agent]

    Organization:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string

    # ---------------------------------------------------------- server ----

    ServerInfo:
      type: object
      required:
        - api_version
        - schema_version
        - min_supported_schema_version
        - server_time
        - capabilities
      properties:
        api_version:
          type: string
          const: v1
        schema_version:
          $ref: '#/components/schemas/SchemaVersion'
        min_supported_schema_version:
          $ref: '#/components/schemas/SchemaVersion'
        server_time:
          $ref: '#/components/schemas/Timestamp'
        capabilities:
          $ref: '#/components/schemas/ServerCapabilities'

    ServerCapabilities:
      type: object
      description: |
        Límites operativos que el cliente debe respetar. Se leen del servidor en lugar de
        codificarse en la app, para poder ajustarlos sin publicar una release.
      additionalProperties: true
      required:
        - sync_push_max_ops
        - sync_push_max_bytes
        - sync_pull_max_limit
        - attachment_max_bytes
        - attachment_allowed_mime
      properties:
        sync_push_max_ops:
          type: integer
          minimum: 1
          description: Máximo de operaciones por lote (ADR-003 = 500).
          examples: [500]
        sync_push_max_bytes:
          type: integer
          minimum: 1
          description: Máximo de bytes por lote, ya descomprimido (ADR-003 = 5 MB).
          examples: [5242880]
        sync_pull_max_limit:
          type: integer
          minimum: 1
          examples: [1000]
        attachment_max_bytes:
          type: integer
          minimum: 1
          description: Tamaño máximo por adjunto individual.
        attachment_allowed_mime:
          type: array
          items:
            $ref: '#/components/schemas/Mime'

    # -------------------------------------------------------- entidades ----

    EntityType:
      type: string
      description: Entidades que participan en la sincronización.
      enum:
        - visit
        - visit_attachment
        - assignment
        - form_template_version

    Visit:
      type: object
      description: |
        Visita de campo. El `id` lo **genera el cliente** (idempotencia real). `answers` se valida
        en el servidor contra el JSON Schema de `template_version_id`. La ubicación son
        **columnas planas**, no geometría (ADR-005).

        **Todas las propiedades son `required`** (convención de entidades emitidas por el
        servidor): lo que es opcional lo es en el *valor* (`null`), nunca en la *presencia*.
        Así el test de deriva Ninja↔contrato detecta un backend que omita un campo en vez de
        emitirlo como `null`.
      required:
        - id
        - org_id
        - version
        - change_seq
        - deleted_at
        - assignment_id
        - template_version_id
        - answers
        - lat
        - lon
        - accuracy_m
        - altitude_m
        - captured_at
        - device_id
        - created_by
        - task_id
        - progress_pct
        - quantities
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        org_id:
          $ref: '#/components/schemas/Uuid'
        version:
          $ref: '#/components/schemas/Version'
        change_seq:
          $ref: '#/components/schemas/ChangeSeq'
        deleted_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
          description: Borrado lógico (tombstone). Purga a los 90 días.
        assignment_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Asignación que originó la visita, si la hubo.
        template_version_id:
          $ref: '#/components/schemas/Uuid'
        answers:
          type: object
          additionalProperties: true
          description: Respuestas del formulario (JSONB), validadas contra `template_version_id`.
        lat:
          type: [number, 'null']
          minimum: -90
          maximum: 90
        lon:
          type: [number, 'null']
          minimum: -180
          maximum: 180
        accuracy_m:
          type: [number, 'null']
          minimum: 0
          description: Precisión horizontal informada por el GPS, en metros.
        altitude_m:
          type: [number, 'null']
        captured_at:
          $ref: '#/components/schemas/Timestamp'
        device_id:
          $ref: '#/components/schemas/Uuid'
        created_by:
          $ref: '#/components/schemas/Uuid'
        task_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            Tarea del cronograma (costos, etapa 1) cuyo avance reporta la visita. Sin tarea,
            `progress_pct` es `null` y `quantities` está vacía; con tarea, hay un `progress_pct`,
            al menos una cantidad, o ambos.
        progress_pct:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: '% de avance acumulado de `task_id` observado en campo, hasta dos decimales.'
        quantities:
          type: array
          description: |
            Costos, pieza 4: cantidades ejecutadas en esta visita por ítem del presupuesto. Cuentan
            para el avance de la tarea cuando la visita está validada. Lista vacía si no hay.
          items:
            $ref: '#/components/schemas/VisitQuantity'

    VisitQuantity:
      type: object
      description: Cantidad ejecutada de un ítem del presupuesto en una visita (costos, pieza 4).
      required: [item_id, location_id, quantity, note]
      properties:
        item_id:
          $ref: '#/components/schemas/Uuid'
        location_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Ubicación precisada en campo; `null` = la ubicación de la tarea.
        quantity:
          type: number
          description: |
            Distinta de 0, hasta 4 decimales. Negativa solo como ajuste. Sale como número JSON
            (el servidor la guarda como decimal exacto): es exacta hasta 15 dígitos
            significativos.
        note:
          type: string
          maxLength: 500

    VisitQuantityPayload:
      type: object
      additionalProperties: false
      required: [item_id, quantity]
      properties:
        item_id:
          $ref: '#/components/schemas/Uuid'
        location_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: El nodo de la tarea o uno de sus descendientes (`FieldTask.location_options`).
        quantity:
          type: number
          description: Distinta de 0, |cantidad| < 10^14, hasta 4 decimales.
        note:
          type: string
          maxLength: 500
          description: |
            La app la exige al capturar si la cantidad es negativa o el ítem no está en el plan
            de la tarea; el servidor la acepta vacía y la revisión lo resalta.

    VisitAttachment:
      type: object
      description: |
        Uso de un blob dentro de una visita. Separa "qué archivo" (`blob`, inmutable y compartido)
        de "dónde se usa". Una visita se acepta aunque el blob todavía no esté subido: el adjunto
        queda pendiente y se confirma por el carril de adjuntos.

        **Todas las propiedades son `required`** (convención de entidades emitidas por el
        servidor); la opcionalidad se expresa con `null` en el valor, no con la ausencia del campo.
      required:
        - id
        - org_id
        - version
        - change_seq
        - deleted_at
        - visit_id
        - sha256
        - role
        - caption
        - captured_at
        - order
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        org_id:
          $ref: '#/components/schemas/Uuid'
        version:
          $ref: '#/components/schemas/Version'
        change_seq:
          $ref: '#/components/schemas/ChangeSeq'
        deleted_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        visit_id:
          $ref: '#/components/schemas/Uuid'
        sha256:
          $ref: '#/components/schemas/Sha256'
        role:
          type: string
          enum: [foto, firma, doc]
        caption:
          type: [string, 'null']
          maxLength: 512
        captured_at:
          $ref: '#/components/schemas/Timestamp'
        order:
          type: integer
          minimum: 0
          description: Orden de presentación dentro de la visita.

    Assignment:
      type: object
      description: |
        Trabajo planificado que origina visitas. Se descarga por el pull; el cliente no la modifica.

        **Todas las propiedades son `required`** (convención de entidades emitidas por el
        servidor); la opcionalidad se expresa con `null` en el valor, no con la ausencia del campo.
      required:
        - id
        - org_id
        - version
        - change_seq
        - deleted_at
        - template_version_id
        - assigned_to
        - title
        - scheduled_for
        - lat
        - lon
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        org_id:
          $ref: '#/components/schemas/Uuid'
        version:
          $ref: '#/components/schemas/Version'
        change_seq:
          $ref: '#/components/schemas/ChangeSeq'
        deleted_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        template_version_id:
          $ref: '#/components/schemas/Uuid'
        assigned_to:
          $ref: '#/components/schemas/Uuid'
        title:
          type: [string, 'null']
          maxLength: 256
        scheduled_for:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        lat:
          type: [number, 'null']
          minimum: -90
          maximum: 90
        lon:
          type: [number, 'null']
          minimum: -180
          maximum: 180

    FormTemplateVersion:
      type: object
      description: |
        Versión inmutable de una plantilla de formulario. `definition` es **JSON declarativo**
        (campos, tipos, etiquetas i18n, obligatoriedad, rangos, visibilidad condicional de un DSL
        restringido). El cliente la **interpreta**; nunca evalúa código remoto (ADR-012).
        Cada visita referencia la versión exacta usada, de modo que las visitas históricas siguen
        siendo interpretables tras cambios de formulario.

        **Todas las propiedades son `required`** (convención de entidades emitidas por el
        servidor); la opcionalidad se expresa con `null` en el valor, no con la ausencia del campo.
      required:
        - id
        - org_id
        - version
        - change_seq
        - deleted_at
        - template_id
        - name
        - version_number
        - definition
        - published_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        org_id:
          $ref: '#/components/schemas/Uuid'
        version:
          $ref: '#/components/schemas/Version'
        change_seq:
          $ref: '#/components/schemas/ChangeSeq'
        deleted_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        template_id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: [string, 'null']
          maxLength: 256
        version_number:
          type: integer
          minimum: 1
        definition:
          type: object
          additionalProperties: true
          description: |
            Definición declarativa del formulario (suno/form@1). Nunca contiene código ejecutable.
            C5 añade `qr` (texto capturado o escaneado), `default` (literal validado al publicar,
            aplicado solo al crear un formulario o fila) y `repeat` (lista de objetos de respuestas).
            Un grupo declara `fields`, `min_rows` (0 por defecto) y `max_rows` (100 por defecto).
            Máximo 3 niveles de repetición, 300 campos declarados y capacidad total de 10000 campos
            expandidos. Las condiciones solo referencian campos hermanos anteriores.
            Los errores de hijos usan rutas como `answers.predios.0.codigo`.
            La fuente normativa del catálogo y sus restricciones es el meta-schema de forms/definition.py;
            los vectores de paridad están en openapi/fixtures/forms_parity.json.
        published_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'

    # --------------------------------------------- envoltorios de sync ----

    EntityRecord:
      description: |
        Fila autoritativa etiquetada con su entidad. Se usa en el pull (`rows`) y en el resultado
        de conflicto del push (`server_row`). `entity` es el discriminador.
      oneOf:
        - $ref: '#/components/schemas/VisitRecord'
        - $ref: '#/components/schemas/VisitAttachmentRecord'
        - $ref: '#/components/schemas/AssignmentRecord'
        - $ref: '#/components/schemas/FormTemplateVersionRecord'
      discriminator:
        propertyName: entity
        mapping:
          visit: '#/components/schemas/VisitRecord'
          visit_attachment: '#/components/schemas/VisitAttachmentRecord'
          assignment: '#/components/schemas/AssignmentRecord'
          form_template_version: '#/components/schemas/FormTemplateVersionRecord'

    VisitRecord:
      type: object
      required: [entity, data]
      properties:
        entity:
          type: string
          const: visit
        data:
          $ref: '#/components/schemas/Visit'

    VisitAttachmentRecord:
      type: object
      required: [entity, data]
      properties:
        entity:
          type: string
          const: visit_attachment
        data:
          $ref: '#/components/schemas/VisitAttachment'

    AssignmentRecord:
      type: object
      required: [entity, data]
      properties:
        entity:
          type: string
          const: assignment
        data:
          $ref: '#/components/schemas/Assignment'

    FormTemplateVersionRecord:
      type: object
      required: [entity, data]
      properties:
        entity:
          type: string
          const: form_template_version
        data:
          $ref: '#/components/schemas/FormTemplateVersion'

    Tombstone:
      type: object
      description: Borrado lógico propagado por el pull.
      required: [entity, id, change_seq, deleted_at]
      properties:
        entity:
          $ref: '#/components/schemas/EntityType'
        id:
          $ref: '#/components/schemas/Uuid'
        change_seq:
          $ref: '#/components/schemas/ChangeSeq'
        deleted_at:
          $ref: '#/components/schemas/Timestamp'

    # ------------------------------------------------------- bootstrap ----

    BootstrapResponse:
      type: object
      description: |
        Estado inicial **completo** para el `RequestContext` del solicitante (doc 08 §6), sin
        paginación en v1.

        `has_more` está **reservado**: en v1 el servidor lo emite siempre como `false` (o lo omite)
        y el cliente debe tratar su ausencia como `false`. Existe para que, si en el futuro el
        bootstrap necesita paginarse, ese cambio no sea una puerta de un solo sentido: los
        clientes ya desplegados conocen el campo y lo toleran en vez de ignorar silenciosamente
        que quedaba estado por descargar. **No se define `limit` ni continuación en v1**; hacerlo
        exigiría el ciclo normal de `schema_version`.
      required:
        - schema_version
        - server_time
        - cursor
        - organization
        - user
        - form_template_versions
        - assignments
        - visits
        - visit_attachments
      properties:
        schema_version:
          $ref: '#/components/schemas/SchemaVersion'
        server_time:
          $ref: '#/components/schemas/Timestamp'
        cursor:
          $ref: '#/components/schemas/Cursor'
        organization:
          $ref: '#/components/schemas/Organization'
        user:
          $ref: '#/components/schemas/UserProfile'
        form_template_versions:
          type: array
          items:
            $ref: '#/components/schemas/FormTemplateVersion'
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
        visits:
          type: array
          items:
            $ref: '#/components/schemas/Visit'
        visit_attachments:
          type: array
          items:
            $ref: '#/components/schemas/VisitAttachment'
        has_more:
          type: boolean
          default: false
          description: |
            **Reservado para compatibilidad futura.** En v1 es siempre `false`: el bootstrap
            devuelve el estado inicial completo. Deliberadamente **no** está en `required`, para
            que un servidor v1 pueda omitirlo; el cliente interpreta la ausencia como `false`.
            Si una versión futura pagina el bootstrap, este campo pasará a `true` en las páginas
            intermedias sin necesidad de romper a los clientes ya desplegados.

    # ------------------------------------------------------------ pull ----

    PullResponse:
      type: object
      required:
        - schema_version
        - server_time
        - rows
        - tombstones
        - next_cursor
        - has_more
      properties:
        schema_version:
          $ref: '#/components/schemas/SchemaVersion'
        server_time:
          $ref: '#/components/schemas/Timestamp'
        rows:
          type: array
          description: Filas cambiadas, en orden estricto ascendente de `change_seq`.
          items:
            $ref: '#/components/schemas/EntityRecord'
        tombstones:
          type: array
          items:
            $ref: '#/components/schemas/Tombstone'
        next_cursor:
          $ref: '#/components/schemas/Cursor'
        has_more:
          type: boolean
          description: |
            `true` si quedan cambios por encima de `next_cursor`. El cliente vuelve a llamar
            inmediatamente; con `false` guarda el cursor y termina el ciclo.

    # ------------------------------------------------------------ push ----

    OpType:
      type: string
      enum: [create, update, delete]
      description: |
        `create` exige `base_version: null`; `update` y `delete` exigen el `base_version`
        conocido por el cliente (guarda CAS).

    SyncOp:
      description: |
        Operación de outbox. `op_uuid` es UUIDv7 generado en el dispositivo y es la **clave de
        idempotencia**: reenviarla devuelve el resultado ya registrado en `sync_op_log`.
        `entity` es el discriminador del payload.
      oneOf:
        - $ref: '#/components/schemas/VisitOp'
        - $ref: '#/components/schemas/VisitAttachmentOp'
      discriminator:
        propertyName: entity
        mapping:
          visit: '#/components/schemas/VisitOp'
          visit_attachment: '#/components/schemas/VisitAttachmentOp'

    SyncOpBase:
      type: object
      required: [op_uuid, entity, op_type, base_version, payload]
      properties:
        op_uuid:
          $ref: '#/components/schemas/Uuid'
        op_type:
          $ref: '#/components/schemas/OpType'
        base_version:
          oneOf:
            - $ref: '#/components/schemas/Version'
            - type: 'null'
          description: |
            Versión sobre la que el cliente basó el cambio. `null` en `create`.
            El UPSERT aplica `WHERE version = base_version`; si no coincide ⇒ `conflict`.

    VisitOp:
      allOf:
        - $ref: '#/components/schemas/SyncOpBase'
        - type: object
          required: [entity, payload]
          properties:
            entity:
              type: string
              const: visit
            payload:
              $ref: '#/components/schemas/VisitPayload'

    VisitAttachmentOp:
      allOf:
        - $ref: '#/components/schemas/SyncOpBase'
        - type: object
          required: [entity, payload]
          properties:
            entity:
              type: string
              const: visit_attachment
            payload:
              $ref: '#/components/schemas/VisitAttachmentPayload'

    VisitPayload:
      type: object
      description: |
        Campos de `visit` que el cliente puede escribir. `org_id`, `version`, `change_seq` y
        `deleted_at` son **server-authoritative** y no se envían.
        En `op_type: create` el servidor exige el conjunto completo
        (`template_version_id`, `answers`, `captured_at`, `device_id`); en `update` basta con los
        campos que cambian; en `delete` basta con `id`. Esa condicionalidad se valida en el
        servidor (Pydantic v2) y no se expresa aquí para no romper la generación de modelos.
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        assignment_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        template_version_id:
          $ref: '#/components/schemas/Uuid'
        answers:
          type: object
          additionalProperties: true
        lat:
          type: [number, 'null']
          minimum: -90
          maximum: 90
        lon:
          type: [number, 'null']
          minimum: -180
          maximum: 180
        accuracy_m:
          type: [number, 'null']
          minimum: 0
        altitude_m:
          type: [number, 'null']
        captured_at:
          $ref: '#/components/schemas/Timestamp'
        device_id:
          $ref: '#/components/schemas/Uuid'
        task_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: |
            Opcional (un cliente anterior no lo envía). Tarea **vigente y de detalle** de la que quien
            envía es responsable (directo o por una tarea superior). Viaja **siempre junto** con
            `progress_pct`, también en `update`: con tarea, `progress_pct` con valor o `null` si hay
            al menos una cantidad; los dos `null` (desvincular); o ninguno. Rechazos: `not_found` (`unknown_reference`), `validation_error`
            (`task_retired`, `task_is_summary`, `task_progress_pair`, `visit_validated`: la visita ya fue
            validada y no puede cambiar de tarea ni de %; también rechaza el `delete` de esa visita, con `field: id`),
            `forbidden` (`not_responsible`). Una operación con `base_version` obsoleto contesta `conflict`,
            no `visit_validated`.
        progress_pct:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: |
            % de avance acumulado de `task_id`, hasta dos decimales. Un valor menor que el último
            validado se acepta y se marca para la supervisión.
        quantities:
          type: array
          maxItems: 200
          description: |
            Opcional (un cliente anterior no lo envía). Reemplaza la lista completa. Solo viaja con
            `task_id` y `progress_pct`; con tarea, `progress_pct` puede ser `null` si hay al menos
            una cantidad. Un `update` con `task_id` y `progress_pct` sin `quantities` deja la lista
            vacía. Rechazos (`validation_error`): `quantities_without_task`, `task_progress_pair`,
            `item_not_in_project` (el ítem no es de un presupuesto del proyecto de la tarea, o es
            un capítulo fuera del plan de la tarea),
            `location_outside_task` (la ubicación no es un nodo del proyecto de la tarea) y
            `visit_validated` (la visita validada no cambia sus cantidades). Lo demás se acepta y
            se resalta en la revisión, porque lo registrado sin conexión nunca se pierde: un ítem
            fuera del plan o un ajuste negativo sin nota (la nota la exige la app al capturar), y
            una ubicación del proyecto fuera de la ubicación actual de la tarea.
          items:
            $ref: '#/components/schemas/VisitQuantityPayload'

    VisitAttachmentPayload:
      type: object
      description: |
        Campos de `visit_attachment` que el cliente puede escribir. El `sha256` puede referenciar
        un blob **aún no subido**: el dato estructurado no espera a los bytes.
        En el MVP solo se admite `op_type: create` (con `visit_id`, `sha256`, `role` y
        `captured_at`); `update`/`delete` se rechazan con `reason: unsupported_op_type`. La visita
        tiene que existir en la organización o crearse antes en el mismo lote.
      required: [id]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        visit_id:
          $ref: '#/components/schemas/Uuid'
        sha256:
          $ref: '#/components/schemas/Sha256'
        role:
          type: string
          enum: [foto, firma, doc]
        caption:
          type: [string, 'null']
          maxLength: 512
        captured_at:
          $ref: '#/components/schemas/Timestamp'
        order:
          type: integer
          minimum: 0

    PushRequest:
      type: object
      description: |
        Lote de operaciones. **Máx. 500 ops (`maxItems`) y máx. 5 MB de cuerpo descomprimido**
        (ADR-003). El límite de bytes no es expresable en JSON Schema: se aplica en el servidor
        y devuelve `413 payload_too_large`.

        La idempotencia es **por operación** (`op_uuid`), no por lote: reenviar el mismo
        `batch_uuid` con un conjunto de operaciones distinto es legítimo y no produce error.
      required: [schema_version, device_id, batch_uuid, ops]
      properties:
        schema_version:
          allOf:
            - $ref: '#/components/schemas/SchemaVersion'
          const: 1
          description: |
            Versión de payload de este contrato (v1). Otra versión ⇒ `422 schema_unsupported`;
            `GET /v1/server/info` publica el rango aceptado.
        device_id:
          $ref: '#/components/schemas/Uuid'
        batch_uuid:
          $ref: '#/components/schemas/Uuid'
          description: |
            Identificador del intento de envío, usado como **telemetría y auditoría** en
            `sync_op_log` (§4.4): permite correlacionar en los logs qué operaciones viajaron
            juntas. **No es clave de idempotencia ni de detección de conflictos** — esa función
            la cumple `op_uuid` (ADR-003).
        ops:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/SyncOp'

    OpStatus:
      type: string
      enum: [applied, conflict, rejected]
      description: |
        - `applied`: la operación se aplicó; el cliente borra la op de la outbox y actualiza `version`.
        - `conflict`: el CAS falló; `server_row` trae la fila autoritativa, que reemplaza la local.
          La versión local del agente se conserva en `quarantine`, **nunca se descarta en silencio**.
        - `rejected`: validación o permisos; `error` explica por qué. Va a `quarantine` para que
          el agente corrija y reenvíe.

    OpResult:
      type: object
      required: [op_uuid, entity, status]
      properties:
        op_uuid:
          $ref: '#/components/schemas/Uuid'
        entity:
          $ref: '#/components/schemas/EntityType'
        entity_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        status:
          $ref: '#/components/schemas/OpStatus'
        server_version:
          oneOf:
            - $ref: '#/components/schemas/Version'
            - type: 'null'
          description: Versión resultante en `applied`, o versión autoritativa actual en `conflict`.
        server_row:
          oneOf:
            - $ref: '#/components/schemas/EntityRecord'
            - type: 'null'
          description: |
            Fila autoritativa completa. Obligatoria en `conflict` (evita re-descargar todo);
            opcional en `applied`.
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: 'null'
          description: 'Presente en `rejected` (y en `conflict` con `code: conflict`).'

    PushResponse:
      type: object
      required: [schema_version, server_time, results]
      properties:
        schema_version:
          $ref: '#/components/schemas/SchemaVersion'
        server_time:
          $ref: '#/components/schemas/Timestamp'
        results:
          type: array
          description: Un resultado por operación enviada, en el mismo orden.
          items:
            $ref: '#/components/schemas/OpResult'

    # ----------------------------------------------------- attachments ----

    PresignRequest:
      type: object
      required: [sha256, size, mime]
      additionalProperties: false
      properties:
        sha256:
          $ref: '#/components/schemas/Sha256'
        size:
          type: integer
          minimum: 1
          maximum: 26214400
          description: |
            Tamaño exacto en bytes. Se fija en la firma y se verifica en el commit. Máximo 25 MiB
            por archivo (`ServerCapabilities.attachment_max_bytes`); por encima, `413`.
        mime:
          $ref: '#/components/schemas/Mime'
        visit_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Visita a la que se destina, para comprobar permisos y cuota por visita.

    PresignResponse:
      type: object
      description: |
        Si `already_present` es `true`, el blob ya existe (deduplicación) y `upload_url`,
        `expires_in` y `required_headers` son `null`: el cliente marca el adjunto como subido y
        pasa directamente al siguiente. Si es `false`, los tres campos vienen informados.
      required: [already_present, server_time]
      properties:
        already_present:
          type: boolean
        upload_url:
          type: [string, 'null']
          format: uri
          description: URL prefirmada para un `PUT` directo al object storage.
        expires_in:
          type: [integer, 'null']
          minimum: 1
          description: Segundos de validez de la URL (900 = 15 min).
        required_headers:
          type: [object, 'null']
          additionalProperties:
            type: string
          description: |
            Cabeceras que el `PUT` debe enviar **exactamente** porque forman parte de la firma
            (`Content-Length`, `Content-Type`).
        server_time:
          $ref: '#/components/schemas/Timestamp'

    CommitRequest:
      type: object
      description: |
        Tamaño y MIME declarados; el servidor hace `HEAD` sobre el objeto y los verifica junto al
        checksum antes de registrar el blob. Discrepancia ⇒ `422 attachment_checksum_mismatch`.
      required: [size, mime]
      additionalProperties: false
      properties:
        size:
          type: integer
          minimum: 1
          maximum: 26214400
        mime:
          $ref: '#/components/schemas/Mime'

    Blob:
      type: object
      description: Blob inmutable direccionado por contenido.
      required: [sha256, size, mime, created_at]
      properties:
        sha256:
          $ref: '#/components/schemas/Sha256'
        size:
          type: integer
          minimum: 1
        mime:
          $ref: '#/components/schemas/Mime'
        created_at:
          $ref: '#/components/schemas/Timestamp'

    DownloadUrlResponse:
      type: object
      required: [url, expires_in, server_time]
      properties:
        url:
          type: string
          format: uri
        expires_in:
          type: integer
          minimum: 1
        mime:
          $ref: '#/components/schemas/Mime'
        size:
          type: integer
          minimum: 1
        server_time:
          $ref: '#/components/schemas/Timestamp'

    # ------------------------------------------------------------ jobs ----

    JobStatus:
      type: string
      enum: [pending, running, succeeded, failed, dead_letter]
      description: |
        `dead_letter` = se superó `max_attempts`; requiere intervención desde el back-office.
        Un job cuyo `locked_until` expira vuelve a `pending` por acción del reaper (RD-13).

    Job:
      type: object
      description: |
        Estado de un trabajo asíncrono (reportes, exportaciones). Solo ADMIN. No expone
        `payload`, `locked_by` ni `locked_until`: son detalle interno del worker.

        **Todas las propiedades son `required`** (convención de entidades emitidas por el
        servidor); la opcionalidad se expresa con `null` en el valor, no con la ausencia del campo.
      required:
        - id
        - type
        - status
        - attempts
        - max_attempts
        - run_after
        - created_at
        - finished_at
        - output
        - error
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          description: Tipo de job (p. ej. `export_visits_csv`).
        status:
          $ref: '#/components/schemas/JobStatus'
        attempts:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
        run_after:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        output:
          type: [object, 'null']
          additionalProperties: true
          description: Salida ya *scrubbed* (RD-12). `null` mientras el job no ha terminado.
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: 'null'
          description: Motivo del fallo en `failed` / `dead_letter`.

    # ---------------------------------------------------------- health ----

    PrivacyPurpose:
      type: string
      enum: [account, location, photos]
      description: |
        Finalidad aceptada en el aviso de privacidad: `account` (cuenta y uso de la app),
        `location` (ubicación de las visitas), `photos` (fotos y firmas de las visitas).

    ConsentRequest:
      type: object
      required: [device_id, notice_version, purposes, accepted_at]
      additionalProperties: false
      properties:
        device_id:
          $ref: '#/components/schemas/Uuid'
        notice_version:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[0-9A-Za-z][0-9A-Za-z._-]*$'
          description: Versión del aviso de privacidad que se mostró (la fija la app).
        purposes:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PrivacyPurpose'
        accepted_at:
          $ref: '#/components/schemas/Timestamp'
          description: Cuándo aceptó, según el teléfono (puede ser antes, sin red).

    ConsentResponse:
      type: object
      required: [id, recorded_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'

    Basemap:
      type: object
      description: Un paquete MBTiles ráster de la organización.
      required: [id, name, sha256, size, tile_format, min_zoom, max_zoom, bounds, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 128
        sha256:
          $ref: '#/components/schemas/Sha256'
        size:
          type: integer
          minimum: 1
          description: Bytes. El cliente comprueba espacio libre antes de descargar.
        tile_format:
          type: string
          enum: [png, jpg, webp]
        min_zoom:
          type: integer
          minimum: 0
          maximum: 24
        max_zoom:
          type: integer
          minimum: 0
          maximum: 24
        bounds:
          type: object
          required: [west, south, east, north]
          properties:
            west: { type: number, minimum: -180, maximum: 180 }
            south: { type: number, minimum: -90, maximum: 90 }
            east: { type: number, minimum: -180, maximum: 180 }
            north: { type: number, minimum: -90, maximum: 90 }
        created_at:
          $ref: '#/components/schemas/Timestamp'

    BasemapList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Basemap'

    BasemapDownload:
      type: object
      required: [url, expires_in, sha256, size]
      properties:
        url:
          type: string
          description: URL prefirmada de `GET`, de corta duración, directa al almacenamiento.
        expires_in:
          type: integer
          minimum: 1
        sha256:
          $ref: '#/components/schemas/Sha256'
        size:
          type: integer
          minimum: 1

    Layer:
      type: object
      description: Una capa de referencia GeoJSON de la organización.
      required: [id, name, sha256, size, feature_count, geometry_types, bounds, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          maxLength: 128
        sha256:
          $ref: '#/components/schemas/Sha256'
        size:
          type: integer
          minimum: 1
        feature_count:
          type: integer
          minimum: 1
        geometry_types:
          type: array
          items:
            type: string
            enum: [Point, MultiPoint, LineString, MultiLineString, Polygon, MultiPolygon]
        bounds:
          type: object
          required: [west, south, east, north]
          properties:
            west: { type: number, minimum: -180, maximum: 180 }
            south: { type: number, minimum: -90, maximum: 90 }
            east: { type: number, minimum: -180, maximum: 180 }
            north: { type: number, minimum: -90, maximum: 90 }
        created_at:
          $ref: '#/components/schemas/Timestamp'

    LayerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Layer'

    MeterUnit:
      type: string
      enum: [hours, kilometers]
      description: Medidor del equipo — `hours` (horómetro) o `kilometers` (odómetro).

    FieldEquipmentType:
      type: object
      required: [id, code, name, preoperational_template_id]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
        name:
          type: string
        preoperational_template_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Formulario preoperacional de la tipología, si tiene uno.

    FieldEquipmentDepartment:
      type: object
      description: Departamento de maquinaria (centro de costo) que absorbe los costos del activo.
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string

    FieldEquipmentMeter:
      type: object
      description: Última lectura de un medidor configurado.
      required: [unit, label, is_primary, value, read_at]
      properties:
        unit:
          $ref: '#/components/schemas/MeterUnit'
        label:
          type: string
        is_primary:
          type: boolean
        value:
          type: number
        read_at:
          $ref: '#/components/schemas/Timestamp'

    FieldEquipmentDocument:
      type: object
      required: [id, type, name, number, expires_on]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          description: Tipo de documento (`registration`, `insurance`, `technical_review`…).
        name:
          type: string
        number:
          type: string
        expires_on:
          type:
            - string
            - 'null'
          format: date

    FieldEquipmentField:
      type: object
      description: Campo adicional definido por la organización (SOAT, certificado de ruido…).
      required: [name, type, value]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [number, date, text]
        value:
          description: Número, fecha ISO (`date`) o texto según `type`; `null` si está vacío.
          oneOf:
            - type: number
            - type: string
            - type: 'null'

    FieldEquipmentAlert:
      type: object
      description: Vigencia próxima o vencida (`days_left` negativo = vencida).
      required: [source, name, expires_on, days_left]
      properties:
        source:
          type: string
          enum: [field, document]
        name:
          type: string
        expires_on:
          type: string
          format: date
        days_left:
          type: integer

    InspectionStatus:
      type: string
      enum: [submitted, approved, rejected, correction_requested]
      description: |
        `submitted` espera revisión; `approved`, `rejected` y `correction_requested` son
        decisiones finales (una corrección es una inspección nueva).

    FieldChecklistItem:
      type: object
      required: [id, label, critical]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        label:
          type: string
        critical:
          type: boolean

    FieldInspectionSummary:
      type: object
      required: [id, captured_at, status, has_faults, review_comment]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        captured_at:
          $ref: '#/components/schemas/Timestamp'
        status:
          $ref: '#/components/schemas/InspectionStatus'
        has_faults:
          type: boolean
        review_comment:
          type: string
          description: Motivo de la revisión; vacío si aún no se revisó o no hubo comentario.

    InspectionAnswerIn:
      type: object
      required: [item_id, ok]
      properties:
        item_id:
          $ref: '#/components/schemas/Uuid'
        ok:
          type: boolean
        note:
          type: string
          maxLength: 500
          default: ''
          description: "Obligatoria cuando `ok` es `false` (describe la novedad)."

    InspectionIn:
      type: object
      required: [id, captured_at, items]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        captured_at:
          $ref: '#/components/schemas/Timestamp'
        meter_unit:
          oneOf:
            - $ref: '#/components/schemas/MeterUnit'
            - type: 'null'
        meter_value:
          type:
            - number
            - 'null'
          minimum: 0
          description: Lectura inicial. Obligatoria con `meter_unit` si el equipo se controla por medidor.
        items:
          type: array
          maxItems: 200
          description: Una respuesta por cada ítem de la lista de chequeo vigente, sin repetir.
          items:
            $ref: '#/components/schemas/InspectionAnswerIn'
        notes:
          type: string
          maxLength: 1000
          default: ''

    InspectionOut:
      type: object
      required: [id, status, has_faults]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/InspectionStatus'
        has_faults:
          type: boolean

    TransportRouteItem:
      type: object
      required: [id, origin, destination, zone, distance_km]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        origin:
          type: string
        destination:
          type: string
        zone:
          type: string
        distance_km:
          type: number

    TransportMaterialItem:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string

    TransportVehicleItem:
      type: object
      required: [id, plate, contractor, capacity_m3]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        plate:
          type: string
        contractor:
          type: string
        capacity_m3:
          type:
            - number
            - 'null'

    TransportPersonItem:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string

    TransportCatalog:
      type: object
      required: [version, changed, routes, materials, vehicles, people]
      properties:
        version:
          type: string
          maxLength: 64
          description: Huella del catálogo. Se reenvía en `?version=` la próxima vez.
        changed:
          type: boolean
        routes:
          type: array
          items:
            $ref: '#/components/schemas/TransportRouteItem'
        materials:
          type: array
          items:
            $ref: '#/components/schemas/TransportMaterialItem'
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/TransportVehicleItem'
        people:
          type: array
          items:
            $ref: '#/components/schemas/TransportPersonItem'

    TripIn:
      type: object
      required:
        - id
        - recorded_at
        - route_id
        - material_id
        - volume_m3
        - requested_by_id
        - dispatched_by_id
        - received_by_id
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
        route_id:
          $ref: '#/components/schemas/Uuid'
        material_id:
          $ref: '#/components/schemas/Uuid'
        volume_m3:
          type: number
          exclusiveMinimum: 0
        equipment_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Equipo propio. Exactamente uno de `equipment_id` y `vehicle_id`.
        vehicle_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Vehículo de terceros. Exactamente uno de `equipment_id` y `vehicle_id`.
        requested_by_id:
          $ref: '#/components/schemas/Uuid'
        dispatched_by_id:
          $ref: '#/components/schemas/Uuid'
        received_by_id:
          $ref: '#/components/schemas/Uuid'
        driver_name:
          type: string
          maxLength: 160
          default: ''
        driver_document:
          type: string
          maxLength: 40
          default: ''
        notes:
          type: string
          maxLength: 300
          default: ''

    TripOut:
      type: object
      required: [id, code, number]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          description: Consecutivo del viaje por organización, p. ej. `TV-000123`.
        number:
          type: integer

    FuelStationItem:
      type: object
      required: [id, name, supplier]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        supplier:
          type: string

    FuelStoreItem:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string

    FuelCatalog:
      type: object
      required: [version, changed, stations, stores]
      properties:
        version:
          type: string
          maxLength: 64
          description: Huella del catálogo. Se reenvía en `?version=` la próxima vez.
        changed:
          type: boolean
        stations:
          type: array
          items:
            $ref: '#/components/schemas/FuelStationItem'
        stores:
          type: array
          items:
            $ref: '#/components/schemas/FuelStoreItem'

    FuelFillIn:
      type: object
      required: [id, source, voucher_number, filled_at, gallons]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        source:
          type: string
          enum: [station, store]
        station_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Obligatoria con `source = station`; prohibida con `store`.
        store_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
          description: Obligatoria con `source = store`; prohibida con `station`.
        fuel_type:
          type: string
          enum: [acpm, gasoline, other]
          default: acpm
        voucher_number:
          type: string
          minLength: 1
          maxLength: 60
        filled_at:
          $ref: '#/components/schemas/Timestamp'
        gallons:
          type: number
          exclusiveMinimum: 0
        meter_unit:
          oneOf:
            - $ref: '#/components/schemas/MeterUnit'
            - type: 'null'
        meter_value:
          type:
            - number
            - 'null'
          minimum: 0
          description: Lectura del medidor al tanquear; obligatoria si el equipo se controla por medidor.
        work_front:
          type: string
          maxLength: 160
          default: ''
        driver_name:
          type: string
          maxLength: 160
          default: ''
        driver_document:
          type: string
          maxLength: 40
          default: ''
        notes:
          type: string
          maxLength: 300
          default: ''

    FuelFillOut:
      type: object
      required: [id, voucher_number]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        voucher_number:
          type: string

    UsageStatus:
      type: string
      enum: [scheduled, in_progress, completed, cancelled]

    FieldUsageProject:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string

    FieldUsageSummary:
      type: object
      required: [id, usage_date, start_time, end_time, hours, activity, project_name, status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        usage_date:
          type: string
          format: date
        start_time:
          type: string
          description: Hora de inicio `HH:MM`.
        end_time:
          type: string
          description: Hora de fin `HH:MM`.
        hours:
          type:
            - number
            - 'null'
        activity:
          type: string
        project_name:
          type: string
        status:
          $ref: '#/components/schemas/UsageStatus'

    UsageReportIn:
      type: object
      required: [id, project_id, usage_date, start_time, end_time, activity]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        usage_date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        activity:
          type: string
          minLength: 1
          maxLength: 200
        location:
          type: string
          maxLength: 200
          default: ''
          description: Ubicación o frente de obra.
        start_meter:
          type:
            - number
            - 'null'
          minimum: 0
        end_meter:
          type:
            - number
            - 'null'
          minimum: 0
        notes:
          type: string
          maxLength: 500
          default: ''

    UsageReportOut:
      type: object
      required: [id, hours, status]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        hours:
          type:
            - number
            - 'null'
        status:
          $ref: '#/components/schemas/UsageStatus'

    FieldMaintenancePlan:
      type: object
      required: [id, name, kind, meter_unit, state, remaining, due_value, due_on, has_open_order]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
        kind:
          type: string
          enum: [meter, date]
        meter_unit:
          oneOf:
            - $ref: '#/components/schemas/MeterUnit'
            - type: 'null'
        state:
          type: string
          enum: [ok, due_soon, overdue, unknown]
          description: "`unknown` si un plan por medidor aún no tiene lecturas."
        remaining:
          type:
            - number
            - 'null'
          description: Lo que falta (horas/km o días); negativo = vencido.
        due_value:
          type:
            - number
            - 'null'
          description: Medidor en el que vence (plan por medidor).
        due_on:
          type:
            - string
            - 'null'
          format: date
          description: Fecha de vencimiento (plan por fecha).
        has_open_order:
          type: boolean

    FieldWorkOrderSummary:
      type: object
      required: [id, code, kind, status, description]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          description: Número de orden por organización, p. ej. `OT-0012`.
        kind:
          type: string
          enum: [preventive, corrective, overhaul]
        status:
          type: string
          enum: [draft, approved, in_execution, closed_technical, cancelled]
        description:
          type: string

    FieldEquipment:
      type: object
      description: Un equipo visible para quien llama, con lo necesario para consultarlo en campo.
      required:
        - id
        - code
        - name
        - qr_identifier
        - equipment_type
        - status
        - ownership
        - license_plate
        - manufacturer
        - model
        - serial_number
        - manufacture_year
        - department
        - control_scheme
        - work_source
        - current_project_id
        - meters
        - meter_units
        - documents
        - fields
        - alerts
        - checklist
        - recent_inspections
        - usage_projects
        - recent_usage
        - maintenance_plans
        - open_work_orders
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
        name:
          type: string
        qr_identifier:
          type: string
          description: Contenido que identifica al equipo en su QR (`suno:eq:<uuid>`).
        equipment_type:
          $ref: '#/components/schemas/FieldEquipmentType'
        status:
          type: string
          enum: [available, assigned, maintenance, out_of_service, retired]
        ownership:
          type: string
          enum: [own, rented, contractor]
        license_plate:
          type: string
        manufacturer:
          type: string
        model:
          type: string
        serial_number:
          type: string
        manufacture_year:
          type:
            - integer
            - 'null'
        department:
          oneOf:
            - $ref: '#/components/schemas/FieldEquipmentDepartment'
            - type: 'null'
        control_scheme:
          type: string
          enum: [meter, date]
        work_source:
          type: string
          enum: [fuel, work_reports]
        current_project_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
        meters:
          type: array
          description: Última lectura de cada medidor que ya tiene lecturas.
          items:
            $ref: '#/components/schemas/FieldEquipmentMeter'
        meter_units:
          type: array
          description: Medidores configurados en la ficha (principal primero).
          items:
            $ref: '#/components/schemas/MeterUnit'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/FieldEquipmentDocument'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldEquipmentField'
        alerts:
          type: array
          description: Más urgente primero.
          items:
            $ref: '#/components/schemas/FieldEquipmentAlert'
        checklist:
          type: array
          description: Lista de chequeo preoperacional vigente de la tipología, en orden.
          items:
            $ref: '#/components/schemas/FieldChecklistItem'
        recent_inspections:
          type: array
          description: Las últimas inspecciones de quien llama sobre este equipo (más reciente primero).
          items:
            $ref: '#/components/schemas/FieldInspectionSummary'
        usage_projects:
          type: array
          description: |
            Proyectos en los que quien llama puede reportar uso de este equipo hoy: los de sus
            asignaciones vigentes en los que el equipo está vinculado.
          items:
            $ref: '#/components/schemas/FieldUsageProject'
        recent_usage:
          type: array
          description: Los últimos usos propios del equipo (más reciente primero), sin costos.
          items:
            $ref: '#/components/schemas/FieldUsageSummary'
        maintenance_plans:
          type: array
          description: Planes preventivos vigentes con lo que falta para cada uno.
          items:
            $ref: '#/components/schemas/FieldMaintenancePlan'
        open_work_orders:
          type: array
          description: Órdenes de trabajo abiertas (borrador, aprobada o en ejecución), por número.
          items:
            $ref: '#/components/schemas/FieldWorkOrderSummary'

    FieldEquipmentList:
      type: object
      required: [version, changed, items]
      properties:
        version:
          type: string
          maxLength: 64
          description: Huella de la lista. Se reenvía en `?version=` la próxima vez.
        changed:
          type: boolean
          description: '`false` si la lista no cambió desde `?version=`; entonces `items` va vacío.'
        items:
          type: array
          items:
            $ref: '#/components/schemas/FieldEquipment'

    MeterReadingIn:
      type: object
      required: [id, meter_unit, value, read_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        meter_unit:
          $ref: '#/components/schemas/MeterUnit'
        value:
          type: number
          minimum: 0
          description: Lectura del medidor, con hasta 2 decimales.
        read_at:
          $ref: '#/components/schemas/Timestamp'
        notes:
          type: string
          maxLength: 300
          default: ''

    MeterReadingOut:
      type: object
      required: [id, meter_unit, value, read_at]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        meter_unit:
          $ref: '#/components/schemas/MeterUnit'
        value:
          type: number
        read_at:
          $ref: '#/components/schemas/Timestamp'

    FieldTask:
      type: object
      description: Una tarea del cronograma a la que la app puede vincular una visita.
      required:
        - id
        - project_id
        - project_name
        - wbs
        - outline_number
        - name
        - last_validated_pct
        - measured_by
        - location
        - location_options
        - planned_items
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        project_id:
          $ref: '#/components/schemas/Uuid'
        project_name:
          type: string
          maxLength: 200
        wbs:
          type: string
          maxLength: 100
          description: EDT del Project; puede venir vacía (se muestra `outline_number`).
        outline_number:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 500
        last_validated_pct:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: |
            % SUNO de la tarea: por cantidades validadas si tiene ítems planeados; si no, el de
            la visita validada más reciente. `null` si no hay.
        measured_by:
          type: string
          enum: [pct, quantities]
          description: |
            `quantities` si la tarea tiene ítems planeados (costos, pieza 4): la app registra
            cantidades y no pide %; `pct` en el resto.
        location:
          oneOf:
            - $ref: '#/components/schemas/FieldLocation'
            - type: 'null'
        location_options:
          type: array
          description: La ubicación de la tarea y sus descendientes vigentes, para precisar en campo.
          items:
            $ref: '#/components/schemas/FieldLocation'
        planned_items:
          type: array
          description: >-
            Ítems planeados que miden la tarea (con cantidad planeada > 0; sin los que hoy
            son capítulos del presupuesto), sin precios ni montos.
          items:
            $ref: '#/components/schemas/FieldPlannedItem'

    FieldTaskList:
      type: object
      required: [version, changed, items]
      properties:
        version:
          type: string
          maxLength: 64
          description: Huella de la lista. Se reenvía en `?version=` la próxima vez.
        changed:
          type: boolean
          description: '`false` si la lista no cambió desde `?version=`; entonces `items` va vacío.'
        items:
          type: array
          items:
            $ref: '#/components/schemas/FieldTask'

    FieldLocation:
      type: object
      required: [id, label]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        label:
          type: string
          description: Ruta completa, p. ej. "Tramo 2 / PR 12+300".

    FieldPlannedItem:
      type: object
      required: [item_id, code, description, unit, planned_quantity, executed_quantity]
      properties:
        item_id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          maxLength: 50
        description:
          type: string
        unit:
          type: string
          maxLength: 30
        planned_quantity:
          type: number
        executed_quantity:
          type: number
          description: Suma de las cantidades de las visitas validadas (puede pasar lo planeado).

    HealthStatus:
      type: object
      description: |
        Cuerpo deliberadamente mínimo: **no filtra información** (ni versión, ni hostname, ni qué
        dependencia falla).
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
